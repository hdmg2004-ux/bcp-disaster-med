<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#3e62ad">
<title>病院医療継続 活動ツール β v11</title>
<style>
:root {
  --primary:#3e62ad; --primary-hover:#2d4a8c; --primary-light:#5c7fc4; --primary-lighter:#e8edf7;
  --success:#22c55e; --success-bg:#dcfce7; --success-border:#86efac; --success-text:#166534;
  --warning:#f59e0b; --warning-bg:#fef3c7; --warning-border:#fcd34d; --warning-text:#92400e;
  --danger:#ef4444; --danger-bg:#fee2e2; --danger-border:#fca5a5; --danger-text:#991b1b;
  --fire:#c2410c; --fire-bg:#fff1e6; --fire-border:#fdba74;
  --gray-50:#f9fafb; --gray-100:#f3f4f6; --gray-200:#e5e7eb; --gray-300:#d1d5db; --gray-400:#9ca3af;
  --gray-500:#6b7280; --gray-600:#4b5563; --gray-700:#374151; --gray-800:#1f2937; --gray-900:#111827;
  --text-primary:#111827; --text-secondary:#6b7280;
  --bg-primary:#fff; --bg-secondary:#f9fafb; --border-default:#e5e7eb;
  --font-sans:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP","Yu Gothic UI","Hiragino Sans",sans-serif;
  --radius-md:.375rem; --radius-lg:.5rem;
  --shadow-sm:0 1px 2px 0 rgb(0 0 0/.05); --shadow-md:0 4px 6px -1px rgb(0 0 0/.1),0 2px 4px -2px rgb(0 0 0/.1);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-sans);background:var(--bg-secondary);color:var(--text-primary);font-size:1rem;line-height:1.55}
button{font-family:inherit;font-size:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--primary);outline-offset:2px}

/* header */
.hdr{background:#fff;border-bottom:3px solid var(--primary);padding:.5rem 1rem;display:flex;flex-wrap:wrap;align-items:center;gap:.5rem .75rem;position:sticky;top:0;z-index:100;box-shadow:var(--shadow-sm)}
.logo{display:flex;align-items:center;gap:.5rem}
.logo-mark{width:32px;height:32px;background:var(--primary);border-radius:var(--radius-md);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700}
.logo-text{font-size:.7rem;color:var(--text-secondary);line-height:1.3}
.logo-text b{display:block;font-size:.95rem;color:var(--text-primary)}
.hdr-sp{flex:1}
.chip{display:inline-flex;align-items:center;gap:.25rem;min-height:36px;padding:0 .75rem;border-radius:999px;border:1px solid var(--gray-300);background:#fff;font-size:.8125rem;font-weight:600;color:var(--gray-700)}
button.chip:hover{background:var(--gray-50)}
.chip.real{background:var(--danger-bg);border-color:var(--danger-border);color:var(--danger-text)}
.chip.drill{background:#e6f5f0;border-color:#3ead8a;color:#1f6b57}
.chip.soon{background:#fff1e0;border-color:#ff8a00;color:#9a3412}
.chip.prep{background:var(--primary-lighter);border-color:var(--primary-light);color:var(--primary-hover)}
.btn-fire{min-height:44px;padding:0 1rem;border-radius:var(--radius-md);border:2px solid var(--fire);background:var(--fire);color:#fff;font-weight:700}
.btn-fire:hover{background:#9a3412}
.band{background:#e6f5f0;border-bottom:2px solid #3ead8a;color:#1f6b57;padding:.375rem 1rem;font-size:.8125rem;font-weight:600;text-align:center}

/* layout */
.main{max-width:980px;margin:0 auto;padding:1.25rem 1rem 3rem}
h1.page{font-size:1.5rem;line-height:1.3;margin-bottom:.25rem}
.lead{color:var(--text-secondary);font-size:.9rem;margin-bottom:1.25rem}
.grid{display:grid;gap:1rem}
.g3{grid-template-columns:repeat(3,1fr)} .g2{grid-template-columns:repeat(2,1fr)}
@media (max-width:760px){.g3,.g2{grid-template-columns:1fr}}
.tile{display:flex;flex-direction:column;gap:.25rem;text-align:left;min-height:120px;padding:1.125rem;background:#fff;border:3px solid var(--border-default);border-radius:var(--radius-lg);box-shadow:var(--shadow-sm);transition:box-shadow .2s,border-color .2s}
.tile:hover{box-shadow:var(--shadow-md);border-color:var(--primary-light)}
.tile .ic{font-size:1.75rem;line-height:1}
.tile .tt{font-size:1.125rem;font-weight:700}
.tile .ds{font-size:.8125rem;color:var(--text-secondary)}
.tile.real{border-color:var(--danger-border)} .tile.drill{border-color:#3ead8a} .tile.soon{border-color:#ff8a00} .tile.prep{border-color:var(--primary-light)}
.tile.stub{opacity:.55;cursor:default;border-style:dashed}
.tile.stub:hover{box-shadow:var(--shadow-sm);border-color:var(--border-default)}
.tile.fire{border-color:var(--fire);background:var(--fire-bg)}
.fire-strip{display:flex;align-items:center;gap:1rem;margin-top:1rem;padding:.875rem 1rem;border:2px solid var(--fire);background:var(--fire-bg);border-radius:var(--radius-lg)}
.kt-strip{display:flex;align-items:center;gap:1rem;margin-top:.75rem;padding:.875rem 1rem;border:2px solid var(--primary);background:var(--primary-lighter);border-radius:var(--radius-lg)}.kt-strip .tx{flex:1;font-size:.875rem}.kt-strip b{display:block;font-size:1rem;color:var(--primary)}
.fire-strip .tx{flex:1;font-size:.875rem}.fire-strip b{display:block;font-size:1rem;color:var(--fire)}
.card{background:#fff;border:1px solid var(--border-default);border-radius:var(--radius-lg);box-shadow:var(--shadow-sm);padding:1.25rem;margin-bottom:1rem}
.card h2{font-size:1.0625rem;margin-bottom:.5rem}
.note{font-size:.8125rem;color:var(--text-secondary)}
.alert{padding:.75rem 1rem;border-radius:var(--radius-md);border:1px solid;font-size:.875rem;margin-bottom:.75rem}
.alert.warn{background:var(--warning-bg);border-color:var(--warning-border);color:var(--warning-text)}
.alert.ng{background:var(--danger-bg);border-color:var(--danger-border);color:var(--danger-text)}
.alert.ok{background:var(--success-bg);border-color:var(--success-border);color:var(--success-text)}
.alert.info{background:var(--primary-lighter);border-color:var(--primary-light);color:var(--primary-hover)}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 1rem;border-radius:var(--radius-md);border:1px solid var(--gray-300);background:#fff;color:var(--gray-700);font-weight:600}
.btn:hover{background:var(--gray-50)}
.btn.pri{background:var(--primary);border-color:var(--primary);color:#fff}.btn.pri:hover{background:var(--primary-hover)}
.row{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center}
.seg{display:flex;flex-wrap:wrap;gap:.5rem}
.seg button{min-height:44px;padding:0 1rem;border:2px solid var(--gray-300);background:#fff;border-radius:var(--radius-md);font-weight:600;color:var(--gray-700)}
.seg button[aria-pressed="true"],.seg button[aria-selected="true"]{border-color:var(--fire);background:var(--fire-bg);color:var(--fire)}
.tabs{display:flex;flex-wrap:wrap;gap:.375rem;border-bottom:2px solid var(--border-default);margin-bottom:1rem}
.tabs button{min-height:44px;padding:0 1rem;border:0;border-bottom:3px solid transparent;background:none;font-weight:600;color:var(--gray-600);margin-bottom:-2px}
.tabs button[aria-selected="true"]{color:var(--primary);border-bottom-color:var(--primary)}

/* placeholders */
.ph{display:inline-block;padding:0 .375rem;border-radius:4px;font-weight:700}
.ph-ok{background:var(--primary-lighter);color:var(--primary-hover)}
.ph-empty{background:var(--gray-100);color:var(--gray-500);border:1px dashed var(--gray-400);font-weight:inherit;font-size:1em}
.npair{margin:0 0 .4rem;font-weight:700}.pair-go{cursor:pointer}
.nprint{margin:0 0 .5rem;padding:.4rem .75rem;border:2px solid #000;border-radius:6px;background:#fff;font-weight:700;text-align:center}
.ni{margin:0 0 .6rem}.ni .sh{margin-bottom:.15rem}.nfl{font-size:.82em;color:var(--gray-700);margin:0 0 .3rem}.nsay{border:1.5px solid #000;border-radius:6px;padding:.3rem .55rem;margin:.25rem 0;background:#fff;line-height:1.9}.nsay p{margin:.1rem 0}.nsay .who{font-size:.82em;font-weight:700}.nsay .rep{font-size:.82em;color:var(--gray-700)}
.blank{display:inline-block;min-width:3.5em;border-bottom:1.5px solid var(--gray-700);margin:0 .125rem}

/* fire cards */
.fire-head{display:flex;align-items:center;gap:.75rem;flex-wrap:wrap;margin-bottom:.75rem}
.fire-head h1{font-size:1.5rem;color:var(--fire)}
.prio{border:7px solid #ff3b14;background:#e5e7eb;color:#000;font-weight:700;font-size:1.3rem;padding:.75rem 1rem;border-radius:6px;margin-bottom:1rem}
/* アクション・カードの原則：赤 極太枠 → 橙 太枠 → 黒 細枠 の順に優先（ACsセミナー／AC資料） */
.step{background:#fff;border-radius:6px;padding:.75rem 1rem;margin-bottom:.75rem;border:1.5px solid #000}
.step.t-r{border:7px solid #ff3b14;padding:.75rem 1rem;background:#e5e7eb}
.step.t-o{border:4px solid #ffb000}
.step.t-k{border:1.5px solid #000}
.step.t-d{border:2px dashed #000;font-size:.9rem}
.step.t-d .sh{font-size:1rem}
.step.t-d .sub{font-size:.92em}
/* 文字の大原則：赤（太字・最大）＞ 橙 ＞ 黒（最小）。本文は枠の色ごとに基準サイズを決め、中の要素は em で追従 */
.step.t-r{font-size:1.25rem;font-weight:700}
.step.t-o{font-size:1.05rem}
.step.t-k{font-size:.9rem}
.step .sh{font-weight:700}
.step.t-k .sub{font-size:.92em}
.step.t-r .sh{font-size:1.5rem}
.step.t-o .sh{font-size:1.2rem}
.step.t-k .sh{font-size:1rem}
.step ul.b{list-style:disc;margin-left:1.25rem}
.step ul.b ul.b{list-style:circle;margin:.125rem 0 .25rem 1.25rem}
.flow-arrow{text-align:center;font-size:1.5rem;line-height:1;color:var(--gray-700);margin:-.25rem 0 .5rem}
.next-card{margin:1.5rem 0 1rem;display:flex;flex-direction:column;gap:.5rem}
.next-card button{min-height:56px;font-size:1.125rem;font-weight:700;border-radius:var(--radius-md);border:2px solid #000;background:#fff;color:#000;padding:.5rem 1rem;text-align:center}
.next-card .end{text-align:center;color:var(--gray-500,#6b7280);font-size:.9rem}
@media print{.next-card{display:none!important}}
.flow-ref{display:inline-block;margin-left:.5rem;font-size:1em;font-weight:700;padding:.0625rem .5rem;border:1.5px solid #000;border-radius:999px;background:#fff;white-space:nowrap}
.lane-band.q{background:#15803d;color:#fff;border-color:#15803d}
.ctitle{border:3px solid #000;border-radius:6px;background:#fff;font-size:1.375rem;font-weight:700;padding:.625rem 1rem;margin-bottom:.75rem}
.redtext{color:#dc2626;font-weight:700;font-size:1.125rem;margin:0 0 .75rem;text-align:center}
.step .box{border:1.5px solid #000;border-radius:4px;background:#fff;padding:.5rem .75rem;margin-top:.75rem;font-size:1em}
.step .box b{display:block;margin-bottom:.25rem}
table.hand{width:100%;border-collapse:collapse;margin-top:.5rem;font-size:.9375rem}
table.hand th,table.hand td{border:1.5px solid #000;padding:.375rem .5rem;height:2rem}
table.hand th{background:#e5e7eb;text-align:left}
.step.t-n{border:0;padding:.25rem .25rem;margin-bottom:.5rem}
.step .sh+.sh,.step .sh~.sh{margin-top:.75rem}
.step ul{list-style:none;margin:.5rem 0 0 0}
.step li{padding:.125rem 0}
.lane-band{display:flex;align-items:baseline;gap:.75rem;flex-wrap:nowrap;white-space:nowrap;overflow:hidden;padding:.75rem 1rem;border-radius:6px 6px 0 0;margin:0 0 .75rem;font-weight:700;font-size:1.5rem;line-height:1.3;border:1.5px solid #000}
.lane-band .famw{display:inline-flex;align-items:baseline;gap:.3em;flex:none}
.lane-band .fam{font-size:max(.6em,10px);font-weight:500;opacity:.85}
.lane-band small{font-weight:400;font-size:.8em}
.anno{display:block;font-size:.8rem;font-weight:400;line-height:1.5;margin-top:.5rem;color:#374151}
.lane-band.n{background:#ff8a00;color:#000;border-color:#ff8a00}
.lane-band.fl{background:#0369a1;color:#fff;border-color:#0369a1}
.lane-band.as{background:#57534e;color:#fff;border-color:#57534e}
.lane-band.hm{background:#1e3a5f;color:#fff;border-color:#1e3a5f}
.blank{display:inline-block;min-width:5em;border-bottom:1.5px solid #000;height:1em;vertical-align:baseline}
.lane-band.x{background:#4338ca;color:#fff;border-color:#4338ca}
.lane-band.w{background:#0f766e;color:#fff;border-color:#0f766e}
.lane-band.flow{background:#f3f4f6;color:#111;border-color:#9ca3af}
.lane-band.leader{background:#fff;color:#000}
.lane-band.s1{background:#ff6a00;color:#fff;border-color:#ff6a00}
.lane-band.s2{background:#8fd8f8;color:#000;border-color:#8fd8f8}
.lane-band.hq{background:#374151;color:#fff;border-color:#374151}
.lane-band.notes{background:#fff1e6;color:#9a3412;border-color:#fdba74}
.legend{font-size:.8125rem;color:var(--gray-700);margin-bottom:.75rem;display:flex;gap:.5rem;flex-wrap:nowrap;white-space:nowrap;overflow:hidden;align-items:center}
.legend i{display:inline-block;width:1.7em;height:.9em;border-radius:2px;background:#fff;vertical-align:middle;margin-right:.25em}
.legend .ld{border:2px dashed #000}.legend .lr{border:5px solid #ff3b14}.legend .lo{border:3px solid #ffb000}.legend .lk{border:1px solid #000}
.step .say{margin:.5rem 0 0 0;padding:.5rem .75rem;background:var(--gray-100);border-radius:var(--radius-md);font-size:1em}
.step .sub{margin:.5rem 0 0 0;font-size:1em;color:var(--gray-700)}
.chk{display:flex;gap:.625rem;align-items:flex-start;min-height:36px;padding:.25rem 0;cursor:pointer}
.chk input{flex:none;width:22px;height:22px;margin-top:.15rem;accent-color:var(--fire)}
.chk span{flex:1}
.warnbox{margin:.5rem 0 0 0;padding:.5rem .75rem;border-radius:var(--radius-md);background:var(--danger-bg);border:1px solid var(--danger-border);color:var(--danger-text);font-size:1em}
.lane-note{font-size:.8125rem;color:var(--text-secondary);margin:-.25rem 0 .75rem}
.shead{font-weight:700;color:var(--gray-700);margin:1rem 0 .5rem;font-size:.9375rem;border-bottom:1px solid var(--border-default);padding-bottom:.25rem}

/* forms */
.fgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:.875rem 1rem;align-items:end}
@media (max-width:760px){.fgrid{grid-template-columns:1fr}}
label.f{display:block;font-size:.875rem;font-weight:600;color:var(--gray-700)}
label.f small{display:block;font-weight:400;color:var(--text-secondary);font-size:.75rem}
input[type=text],input[type=number],select,textarea{display:block;width:100%;min-height:44px;margin-top:.25rem;padding:.5rem .75rem;border:1px solid var(--gray-300);border-radius:var(--radius-md);background:#fff;font:inherit;font-size:1rem}
textarea{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.8125rem;min-height:140px}
input:disabled,select:disabled{background:var(--gray-100);cursor:not-allowed}
.fl-row{display:flex;gap:.75rem;align-items:flex-start;padding:.625rem 0;border-bottom:1px solid var(--gray-100)}
.fl-row .lb{flex:1;font-weight:600}.fl-row .rs{flex:2}
.tag{display:inline-block;padding:.125rem .5rem;border-radius:999px;font-size:.75rem;font-weight:700}
.tag.ng{background:var(--danger-bg);color:var(--danger-text)}.tag.ok{background:var(--success-bg);color:var(--success-text)}
.tag.nn{background:var(--gray-100);color:var(--gray-600)}.tag.wn{background:var(--warning-bg);color:var(--warning-text)}

/* print */
#printArea{display:none}
.pg{padding:0}
.pg h2{font-size:1.5rem;border:3px solid #000;padding:.5rem .75rem;margin-bottom:.75rem}
.pbreak{display:none}
.fit-in .step{margin-bottom:calc(.75rem*var(--sp,1));padding-top:calc(.75rem*var(--sp,1));padding-bottom:calc(.75rem*var(--sp,1))}
.fit-in .step.t-n{padding-top:calc(.25rem*var(--sp,1));padding-bottom:calc(.25rem*var(--sp,1))}
.fit-in .step li{padding:calc(.125rem*var(--sp,1)) 0}
.fit-in .chk{padding:calc(.25rem*var(--sp,1)) 0}
.fit-in .step .sub,.fit-in .step .say{margin-top:calc(.5rem*var(--sp,1))}
.ftr{margin:2rem 0 5rem;padding:.75rem 1rem;border-top:1px solid var(--gray-200);text-align:center;font-size:.75rem;color:var(--gray-600);display:flex;flex-wrap:wrap;gap:.25rem .75rem;justify-content:center;align-items:center}
.lnk{background:none;border:0;color:var(--primary);text-decoration:underline;cursor:pointer;font-size:inherit;min-height:44px;padding:0 .5rem}
.abt dl{display:grid;grid-template-columns:6.5rem 1fr;gap:.375rem .75rem;margin:.5rem 0;font-size:.875rem}.abt dt{font-weight:700;color:var(--gray-700)}.abt dd{margin:0}
.abt .addr{font-family:var(--font-mono,monospace);background:var(--gray-100);border-radius:4px;padding:.125rem .5rem;user-select:all}
a.btn{text-decoration:none}
.pg-foot{margin-top:1rem;white-space:nowrap;overflow:hidden;font-size:.6rem;color:#555;border-top:1px solid #999;padding-top:.25rem}
@page{size:A4;margin:12mm}

/* 行動判断支援票（本部ホーム） */
.chip[aria-pressed="true"]{background:var(--primary);border-color:var(--primary);color:#fff}
.ref-nav{display:flex;flex-wrap:wrap;gap:.375rem;margin:.5rem 0 .75rem}
.ref-sec{border:1px solid var(--gray-300);border-radius:var(--radius-md);background:#fff;margin-top:.5rem;scroll-margin-top:.5rem}
.ref-sec>summary{cursor:pointer;font-weight:700;font-size:1.0625rem;padding:.625rem .75rem;min-height:44px;color:#1e3a5f}
.ref-sec[open]>summary{border-bottom:1px solid var(--gray-200);background:var(--primary-lighter)}
.ref-b{padding:.75rem;line-height:1.7;max-width:46rem}
.ref-b p{margin:.5rem 0}.ref-b ul,.ref-b ol{margin:.5rem 0 .5rem 1.25rem;display:flex;flex-direction:column;gap:.375rem}
.ref-lead{font-weight:600;font-size:1.0625rem}
.ref-why{margin-top:.75rem;border:1px dashed var(--gray-300);border-radius:var(--radius-md);padding:.375rem .625rem;background:var(--bg-secondary)}
.ref-why>summary{cursor:pointer;font-weight:600;min-height:36px;display:flex;align-items:center;color:var(--gray-700)}
.ref-tw{overflow-x:auto;margin:.5rem 0}
.ref-t{border-collapse:collapse;font-size:.9375rem;min-width:20rem}
.ref-t th,.ref-t td{border:1px solid var(--gray-300);padding:.375rem .5rem;text-align:center;vertical-align:middle}
.ref-t thead th{background:var(--gray-100)}.ref-t tbody th{background:var(--gray-50);white-space:nowrap}
.ref-nw th,.ref-nw td{white-space:nowrap}
.ref-form th,.ref-form td{font-size:.8125rem;padding:.3rem .25rem;min-width:2.5rem;height:1.9rem}.ref-form td{background:#fff}.ref-form{min-width:36rem}
.ref-mark th{font-size:1.25rem;width:3rem}.ref-mark td{text-align:left}
.ref-mark th.ok{color:var(--success-text);background:var(--success-bg)}.ref-mark th.mid{color:var(--warning-text);background:var(--warning-bg)}.ref-mark th.ng{color:var(--danger-text);background:var(--danger-bg)}
.ref-ex{border-left:4px solid var(--primary-light);background:var(--primary-lighter);padding:.5rem .75rem;margin:.25rem 0 .75rem;border-radius:0 var(--radius-md) var(--radius-md) 0}
.ref-b dl{display:grid;gap:.25rem}.ref-b dt{font-weight:700;margin-top:.5rem}.ref-b dd{margin-left:1rem}
button.chip[aria-pressed="true"]:hover{background:var(--primary-hover);color:#fff}
.kt{background:#fff;border:2px solid var(--gray-700);border-radius:var(--radius-lg);padding:.75rem;margin:.75rem 0}
.kt-hd{display:flex;justify-content:space-between;gap:.5rem;align-items:flex-end;border-bottom:2px solid var(--gray-700);padding-bottom:.375rem;margin-bottom:.5rem}
.kt-h{font-size:1.125rem;font-weight:700}.kt-s{font-size:.8125rem;font-weight:700;color:var(--primary)}
.kstep{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;font-weight:700;margin:.25rem 0 .375rem}
.kno{background:var(--gray-800);color:#fff;border-radius:4px;padding:.0625rem .5rem;font-size:.8125rem}
.kleg{font-size:.8125rem;color:var(--gray-700);margin-bottom:.375rem}
.ktb{width:100%;border-collapse:collapse;font-size:.875rem}
.ktb th,.ktb td{border:1px solid var(--gray-400);padding:0;text-align:center}
.ktb th{background:var(--gray-100);font-size:.8125rem;padding:.25rem}
.kcat{background:var(--gray-100);font-weight:700;font-size:.75rem;width:3.5rem;padding:.25rem;word-break:break-all;line-height:1.3}
.kitem{text-align:left!important;padding:.375rem .5rem!important}.kitem.sub{padding-left:1.25rem!important;color:var(--gray-700)}
.kex{display:block;font-size:.75rem;color:var(--gray-600)}
.knote{display:block;font-size:.8125rem;color:var(--warning-text);background:var(--warning-bg);border-radius:4px;padding:.25rem .5rem;margin-top:.25rem}
.knote-b{margin-left:.375rem;width:1.5rem;height:1.5rem;border-radius:50%;border:1px solid var(--gray-400);background:#fff;font-weight:700;font-size:.75rem;color:var(--primary);cursor:pointer}
.ksc-w{width:3.25rem;height:3rem}

.ksc:hover{background:var(--primary-lighter)}
.ksc.sel.m{background:var(--success-bg)}.ksc.sel.s{background:var(--warning-bg)}.ksc.sel.x{background:var(--danger-bg)}
.ksc.sel{box-shadow:inset 0 0 0 3px currentColor}
.kna,.ktb td.na{color:var(--gray-400);background:var(--gray-100)}
.khd{background:var(--gray-100);font-weight:700;font-size:.8125rem;padding:.375rem!important;white-space:nowrap}
.kdmg{padding:.625rem .25rem!important;font-weight:700;background:#fff}
.kdmg.sel{background:var(--primary);color:#fff}
.kact{padding:.375rem .25rem!important;font-size:.8125rem;line-height:1.35}
.kact.sel{background:var(--warning-bg);font-weight:700;box-shadow:inset 0 0 0 2px var(--warning)}
.kbadge{margin-left:auto;border-radius:999px;padding:.125rem .75rem;font-size:.8125rem;font-weight:700;border:1px solid}
.kbadge.l0{background:var(--success-bg);color:var(--success-text);border-color:var(--success-border)}
.kbadge.l1{background:#dbeafe;color:#1e40af;border-color:#93c5fd}
.kbadge.l2{background:var(--warning-bg);color:var(--warning-text);border-color:var(--warning-border)}
.kbadge.l3{background:#ffedd5;color:#9a3412;border-color:#fdba74}
.kbadge.l4{background:var(--danger-bg);color:var(--danger-text);border-color:var(--danger-border)}
.kcard{border:1px solid var(--gray-300);border-radius:var(--radius-md);overflow:hidden;margin-top:.75rem;background:#fff}
.kcard-h{background:var(--primary);color:#fff;font-weight:700;font-size:.875rem;padding:.375rem .75rem}
.kcard-b{padding:.625rem .75rem}.kcard-w{background:var(--warning-bg);color:var(--warning-text);font-size:.8125rem;padding:.25rem .75rem;border-top:1px solid var(--warning-border)}
.klab{color:var(--primary);margin-right:.375rem}
.krec-t{font-weight:700;font-size:.8125rem;margin-bottom:.25rem}
.krec{display:flex;align-items:center;gap:.5rem;padding:.25rem 0;border-bottom:1px solid var(--gray-100)}.krec .note{margin-left:auto}
.krk{display:inline-flex;align-items:center;justify-content:center;min-width:1.5rem;height:1.5rem;border-radius:50%;font-weight:700;font-size:.8125rem}
.krk.x{background:var(--danger);color:#fff}.krk.s{background:var(--warning);color:var(--warning-text)}
.kfn{margin:.5rem 0;border:1px solid var(--gray-300);border-radius:var(--radius-md);padding:.5rem .75rem;background:#fff}.kfn summary{cursor:pointer;font-weight:600;min-height:32px}

.kbtn-s{min-height:36px;padding:0 .625rem;font-size:.8125rem;margin:.25rem .375rem 0 0}
.kbig{flex:1;min-width:12em;min-height:64px;font-size:1.0625rem;font-weight:700;flex-direction:column;line-height:1.3}.kbig small{font-weight:400;font-size:.8125rem}
.kbig.ok{border:3px solid var(--success-border);background:var(--success-bg);color:var(--success-text)}.kbig.ng{border:3px solid var(--danger-border);background:var(--danger-bg);color:var(--danger-text)}
.kbig[aria-pressed="true"]{box-shadow:0 0 0 3px #111 inset}
.kev{padding:.5rem 0;border-bottom:1px solid var(--gray-100)}.kev-l{display:block;font-weight:600;font-size:.9375rem}
.knode{display:flex;gap:.5rem;border:1px solid var(--gray-300);border-left-width:6px;border-radius:var(--radius-md);padding:.5rem .75rem;margin:.5rem 0;background:#fff}
.knode.dec{border-left-color:var(--warning)}.knode.way{border-left-color:var(--success)}.knode.und{background:var(--gray-50)}
.knode-ic{font-size:1.25rem}.knode-b{flex:1}.knode-row{margin-top:.25rem;display:flex;gap:.5rem;align-items:center}.knode-links{display:flex;flex-wrap:wrap}
.ktag{display:inline-block;font-size:.75rem;font-weight:700;background:var(--gray-100);border-radius:999px;padding:.0625rem .5rem;color:var(--gray-700)}
.kbadge-card{border:2px solid var(--gray-300)}.kbadge-card.l0{background:var(--success-bg)}.kbadge-card.l1{background:#dbeafe}.kbadge-card.l2{background:var(--warning-bg)}.kbadge-card.l3{background:#ffedd5}.kbadge-card.l4{background:var(--danger-bg)}
.hqt-row{display:flex;gap:.5rem;align-items:flex-start;padding:.625rem .5rem;border-bottom:1px solid var(--gray-100)}.hqt-row.star{background:var(--gray-50)}.hqt-row.on{opacity:.65}
.hqt-c{display:flex;align-items:center;justify-content:center;min-width:44px;min-height:44px}.hqt-c input{width:24px;height:24px}
.hqt-t{font-weight:700}.hqt-row.on .hqt-t{text-decoration:line-through}.hqt-b{flex:1}
.hqt-loop{margin:.25rem 0 .25rem 3.25rem;padding:.5rem .75rem;border:1px dashed var(--gray-400,#9ca3af);border-radius:8px;font-weight:700}
.hqt-bar{height:10px;background:var(--gray-200);border-radius:999px;overflow:hidden}.hqt-bar div{height:100%;background:var(--primary)}
.khist{border:1px solid var(--gray-300);border-radius:var(--radius-md);margin:.5rem 0;background:#fff;overflow:hidden}
.khist-h{display:flex;flex-wrap:wrap;gap:.375rem;align-items:center;width:100%;min-height:44px;padding:.5rem .75rem;border:0;background:var(--gray-50);text-align:left;font-size:.9375rem;cursor:pointer}
.khist-m{margin-left:auto;color:var(--primary);font-weight:700}.khist-d{padding:.5rem .75rem;font-size:.875rem;line-height:1.7}.khist-memo{background:var(--gray-100);border-radius:4px;padding:.25rem .5rem;margin-top:.25rem}
.khist-t{padding:.5rem;background:#555}.khist-t .kp{background:#fff;padding:.75rem;max-width:640px;margin:0 auto}
.kmemo{width:100%}
.back-float{position:fixed;left:12px;bottom:16px;z-index:200;display:flex;gap:.375rem;filter:drop-shadow(0 4px 10px rgba(0,0,0,.35))}

.cl-sec{margin:1.25rem 0;border:1px solid var(--gray-300);border-radius:var(--radius-md);overflow:hidden}

.cl-b{color:#fff;border-radius:4px;padding:0 .5rem;font-size:.8125rem}
.cl-sec[data-lv="1"] .cl-h{background:var(--success-bg);color:var(--success-text)}.cl-sec[data-lv="1"] .cl-b{background:var(--success)}
.cl-sec[data-lv="2"] .cl-h{background:var(--warning-bg);color:var(--warning-text)}.cl-sec[data-lv="2"] .cl-b{background:var(--warning)}
.cl-sec[data-lv="3"] .cl-h{background:var(--danger-bg);color:var(--danger-text)}.cl-sec[data-lv="3"] .cl-b{background:var(--danger)}

.cl-flood{margin:.5rem .75rem;padding:.5rem .75rem;border:1px solid var(--gray-300);border-radius:6px;background:var(--gray-50)}

.cl-row.on{background:var(--gray-50)}.cl-row.on .cl-t{color:var(--gray-500)}
.cl-c{display:flex;align-items:center;justify-content:center;min-height:44px}.cl-c input{width:24px;height:24px}
.cl-t{line-height:1.55;padding-top:.5rem}.cl-n{font-size:.8125rem;color:var(--gray-600);margin-top:.125rem}
.cl-f{display:block;font-size:.6875rem;color:var(--gray-500)}.cl-f input{margin-top:.125rem;min-height:40px}

.cl-prog{margin:.5rem 0 1rem}
.lane-band.cl{background:#374151;color:#fff;border-color:#374151}

.clp-tb{width:100%;border-collapse:collapse;font-size:.75rem}.clp-tb td{border:1px solid #444;padding:.125rem .25rem;vertical-align:top}

.kp{font-size:.8rem}
.kp-hd{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2px solid #000;padding-bottom:.25rem;margin-bottom:.375rem}
.kp-h{font-size:1.25rem;font-weight:700}.kp-s{font-weight:700}.kp-m{text-align:right;font-size:.75rem}
.kpstep{display:flex;gap:.5rem;align-items:center;font-weight:700;margin:.25rem 0}.kpno{background:#000;color:#fff;padding:0 .4rem;border-radius:3px}
.kptb{width:100%;border-collapse:collapse}.kptb th,.kptb td{border:1px solid #444;padding:.1875rem .25rem;text-align:center}
.kptb th{background:#e5e7eb}.kpcat{background:#e5e7eb;font-weight:700;font-size:.7rem;width:3rem;word-break:break-all;line-height:1.25}
.kpitem{text-align:left!important}.kpitem.sub{padding-left:.9rem!important}.kpitem .kex{display:block;font-size:.65rem;color:#333}
.kpsc{width:2.25rem;font-weight:700;font-size:1rem;color:#555}.kpsc.na{color:#bbb;background:#f3f4f6;font-size:.7rem}
.kpsc.sel.m{background:#e5e7eb;color:#000}.kpsc.sel.s{background:#9ca3af;color:#000}.kpsc.sel.x{background:#374151;color:#fff}
.kphd{background:#e5e7eb;font-weight:700}.kpdmg{padding:.3rem!important;font-weight:700}.kpdmg.sel,.kpact.sel{background:#9ca3af;font-weight:900;text-decoration:underline}
.kpact{font-size:.7rem;line-height:1.3}
.kp-sign{display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px;margin-top:.5rem}.kp-sign div{border:1px solid #666;padding:.25rem .375rem;min-height:1.75rem}
@media print{
  .ctitle{border-width:2.5px}
  body{background:#fff;font-size:11pt}
  #app,.band,.hdr{display:none!important}
  #printArea{display:block}
  .pg{page-break-after:always;break-after:page}
  .pbreak{display:block;height:0;break-before:page;page-break-before:always}
  .pg:last-child{page-break-after:auto}
  .ph-ok{background:none;color:#000;font-weight:700;padding:0}
  .ph-empty{background:none;border:0;border-bottom:1.5px solid #000;color:transparent;min-width:3.5em;padding:0;border-radius:0}
  .step{break-inside:avoid;border-color:#000}

  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .lane-band{font-size:1.3rem;gap:.5rem;padding:.5rem .75rem}   /* 印刷の見出しは色帯（番号入り・一行） */
  .chk input{accent-color:#000}
}
